<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0d1117">
  <title>Antigravity Mobile</title>
  <link rel="manifest" href="/manifest.json">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <style>
    :root {
      --bg: #0d1117;
      --surface: #161b22;
      --border: #30363d;
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --text: #f0f6fc;
      --text-muted: #8b949e;
      --user-bubble: #238636;
      --agent-bubble: #1f242c;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Header */
    header {
      background: rgba(22, 27, 34, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: env(safe-area-inset-top, 12px) 16px 12px;
      display: flex;
      align-items: center;
      justifyContent: space-between;
      flex-shrink: 0;
      z-index: 10;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: 1.05rem;
      letter-spacing: -0.01em;
    }

    .brand-icon {
      color: var(--primary);
      font-size: 1.2rem;
    }

    .status-badge {
      font-size: 0.72rem;
      padding: 2px 8px;
      border-radius: 12px;
      background: rgba(35, 134, 54, 0.2);
      color: #3fb950;
      border: 1px solid rgba(35, 134, 54, 0.4);
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #3fb950;
      box-shadow: 0 0 8px #3fb950;
    }

    /* Chat Messages Container */
    #chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      -webkit-overflow-scrolling: touch;
    }

    .msg-wrapper {
      display: flex;
      flex-direction: column;
      max-width: 88%;
      animation: fadeIn 0.15s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .msg-wrapper.user {
      align-self: flex-end;
    }

    .msg-wrapper.agent {
      align-self: flex-start;
      max-width: 95%;
    }

    .msg-bubble {
      padding: 10px 14px;
      border-radius: 14px;
      font-size: 0.92rem;
      line-height: 1.5;
      word-break: break-word;
    }

    .user .msg-bubble {
      background: var(--primary);
      color: #ffffff;
      border-bottom-right-radius: 4px;
      box-shadow: 0 2px 8px rgba(99, 102, 241, 0.3);
    }

    .agent .msg-bubble {
      background: var(--agent-bubble);
      color: var(--text);
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
    }

    /* Markdown inside messages */
    .agent .msg-bubble p { margin-bottom: 8px; }
    .agent .msg-bubble p:last-child { margin-bottom: 0; }
    .agent .msg-bubble pre {
      background: #0d1117;
      padding: 10px;
      border-radius: 8px;
      overflow-x: auto;
      margin: 8px 0;
      border: 1px solid var(--border);
      font-size: 0.8rem;
    }
    .agent .msg-bubble code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.85em;
      background: rgba(255,255,255,0.08);
      padding: 2px 4px;
      border-radius: 4px;
    }
    .agent .msg-bubble pre code {
      background: transparent;
      padding: 0;
    }

    /* Tool Call Badges */
    .tool-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: rgba(99, 102, 241, 0.15);
      border: 1px solid rgba(99, 102, 241, 0.3);
      color: #a5b4fc;
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 0.72rem;
      margin-bottom: 6px;
      font-family: ui-monospace, monospace;
    }

    /* Input Footer */
    footer {
      background: var(--surface);
      border-top: 1px solid var(--border);
      padding: 10px 14px calc(env(safe-area-inset-bottom, 10px) + 10px);
      flex-shrink: 0;
    }

    .input-row {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #0d1117;
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 4px 6px 4px 14px;
      transition: border-color 0.2s;
    }

    .input-row:focus-within {
      border-color: var(--primary);
      box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.2);
    }

    textarea {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text);
      font-size: 0.95rem;
      resize: none;
      outline: none;
      max-height: 100px;
      min-height: 24px;
      font-family: inherit;
      padding: 4px 0;
    }

    .btn-action {
      background: transparent;
      border: none;
      color: var(--text-muted);
      width: 34px;
      height: 34px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: all 0.15s;
    }

    .btn-action.send {
      background: var(--primary);
      color: white;
    }

    .btn-action.mic.active {
      color: #ef4444;
      animation: pulse 1s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(1.1); }
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <span class="brand-icon">✨</span>
      <span>Antigravity Mobile</span>
    </div>
    <div class="status-badge" id="status-indicator">
      <span class="status-dot"></span>
      <span id="status-text">Connected</span>
    </div>
  </header>

  <div id="chat-container">
    <!-- Messages loaded dynamically -->
  </div>

  <footer>
    <div class="input-row">
      <textarea id="prompt-input" rows="1" placeholder="Type prompt or command (e.g. 搜一下绝命毒师)..."></textarea>
      <button class="btn-action mic" id="mic-btn" title="Voice Input">🎤</button>
      <button class="btn-action send" id="send-btn" title="Send">➔</button>
    </div>
  </footer>

  <script>
    const chatContainer = document.getElementById('chat-container');
    const promptInput = document.getElementById('prompt-input');
    const sendBtn = document.getElementById('send-btn');
    const micBtn = document.getElementById('mic-btn');
    const statusIndicator = document.getElementById('status-indicator');
    const statusText = document.getElementById('status-text');

    let isAutoScrolling = true;

    // Configure Marked options
    marked.setOptions({
      highlight: function(code, lang) {
        if (lang && hljs.getLanguage(lang)) {
          return hljs.highlight(code, { language: lang }).value;
        }
        return hljs.highlightAuto(code).value;
      },
      breaks: true
    });

    // Auto resize textarea
    promptInput.addEventListener('input', () => {
      promptInput.style.height = 'auto';
      promptInput.style.height = Math.min(promptInput.scrollHeight, 100) + 'px';
    });

    function scrollToBottom() {
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    function renderMessages(messages) {
      chatContainer.innerHTML = '';
      messages.forEach(msg => {
        const wrapper = document.createElement('div');
        wrapper.className = `msg-wrapper ${msg.sender}`;

        let toolsHtml = '';
        if (msg.tools && msg.tools.length > 0) {
          toolsHtml = msg.tools.map(t => `<div class="tool-badge">⚡ ${t}</div>`).join('');
        }

        const bubble = document.createElement('div');
        bubble.className = 'msg-bubble';

        if (msg.sender === 'agent') {
          bubble.innerHTML = `${toolsHtml}<div>${marked.parse(msg.text || '')}</div>`;
        } else {
          bubble.textContent = msg.text;
        }

        wrapper.appendChild(bubble);
        chatContainer.appendChild(wrapper);
      });

      scrollToBottom();
    }

    // Fetch initial messages
    async function loadInitialMessages() {
      try {
        const res = await fetch('/api/messages');
        const data = await res.json();
        if (data.success && data.messages) {
          renderMessages(data.messages);
        }
      } catch (err) {
        console.error('Error fetching initial messages:', err);
      }
    }

    // Connect WebSocket
    function initWebSocket() {
      const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
      const ws = new WebSocket(`${protocol}//${location.host}`);

      ws.onopen = () => {
        statusText.textContent = 'Connected';
        statusIndicator.style.background = 'rgba(35, 134, 54, 0.2)';
        statusIndicator.style.color = '#3fb950';
      };

      ws.onmessage = (event) => {
        try {
          const data = JSON.parse(event.data);
          if (data.type === 'SYNC_MESSAGES' && data.messages) {
            renderMessages(data.messages);
          }
        } catch (e) {}
      };

      ws.onclose = () => {
        statusText.textContent = 'Reconnecting...';
        statusIndicator.style.background = 'rgba(234, 179, 8, 0.2)';
        statusIndicator.style.color = '#eab308';
        setTimeout(initWebSocket, 2000);
      };
    }

    // Send Message
    async function sendMessage() {
      const text = promptInput.value.trim();
      if (!text) return;

      promptInput.value = '';
      promptInput.style.height = 'auto';

      // Optimistically append user message
      const wrapper = document.createElement('div');
      wrapper.className = 'msg-wrapper user';
      const bubble = document.createElement('div');
      bubble.className = 'msg-bubble';
      bubble.textContent = text;
      wrapper.appendChild(bubble);
      chatContainer.appendChild(wrapper);
      scrollToBottom();

      try {
        await fetch('/api/send', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt: text })
        });
      } catch (err) {
        console.error('Error sending message:', err);
      }
    }

    sendBtn.addEventListener('click', sendMessage);
    promptInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    // Voice recognition (Web Speech API)
    if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      const recognition = new SpeechRecognition();
      recognition.lang = 'zh-CN';
      recognition.continuous = false;

      let isListening = false;

      micBtn.addEventListener('click', () => {
        if (isListening) {
          recognition.stop();
        } else {
          recognition.start();
        }
      });

      recognition.onstart = () => {
        isListening = true;
        micBtn.classList.add('active');
      };

      recognition.onresult = (event) => {
        const transcript = event.results[0][0].transcript;
        promptInput.value = (promptInput.value ? promptInput.value + ' ' : '') + transcript;
        promptInput.dispatchEvent(new Event('input'));
      };

      recognition.onend = () => {
        isListening = false;
        micBtn.classList.remove('active');
      };
    } else {
      micBtn.style.display = 'none';
    }

    loadInitialMessages();
    initWebSocket();
  </script>
</body>
</html>
